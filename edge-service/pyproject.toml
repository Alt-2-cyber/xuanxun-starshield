[project]
name = "xuanxun-fire-edge"
version = "0.1.0"
description = "玄巡·星盾 Ubuntu edge service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pyserial>=3.5,<4",
  "websockets>=12,<16",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9"
]

[project.scripts]
fire-edge = "fire_edge.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_edge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
