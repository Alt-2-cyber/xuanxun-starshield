<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><title>软件分层</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 6  软件分层与安全依赖方向</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">高层任务、视觉和 Web/App 均通过受控接口进入 Edge；ROS 2 是唯一的运动安全出口。</text><rect x="80" y="118" width="1040" height="56" rx="10" fill="#E7F5F3" stroke="#138A8A" stroke-width="2"/><text x="112" y="153" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#138A8A" text-anchor="start">交互层</text><text x="340" y="153" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#263746" text-anchor="start">Windows Web / 鸿蒙 ArkUI / 浏览器语音</text><line x1="600" y1="176" x2="600" y2="194" stroke="#60758A" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="196" width="1040" height="56" rx="10" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="2"/><text x="112" y="231" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C6DB2" text-anchor="start">服务层</text><text x="340" y="231" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#263746" text-anchor="start">FastAPI REST / WebSocket / DeepSeek 任务解析</text><line x1="600" y1="254" x2="600" y2="272" stroke="#60758A" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="274" width="1040" height="56" rx="10" fill="#FBE9E7" stroke="#B54444" stroke-width="2"/><text x="112" y="309" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#B54444" text-anchor="start">安全层</text><text x="340" y="309" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#263746" text-anchor="start">模式状态 / 限速 / 前方 0.45 m 停车 / 急停锁存</text><line x1="600" y1="332" x2="600" y2="350" stroke="#60758A" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="352" width="1040" height="56" rx="10" fill="#FFF3D9" stroke="#D17A16" stroke-width="2"/><text x="112" y="387" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#D17A16" text-anchor="start">数据层</text><text x="340" y="387" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#263746" text-anchor="start">TwinState / VisionGate / SQLite / JSONL 回放</text><line x1="600" y1="410" x2="600" y2="428" stroke="#60758A" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="430" width="1040" height="56" rx="10" fill="#EEF5F6" stroke="#138A8A" stroke-width="2"/><text x="112" y="465" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#138A8A" text-anchor="start">ROS 适配层</text><text x="340" y="465" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#263746" text-anchor="start">Ubuntu HTTP 控制桥 / /odom /scan /cmd_vel</text><line x1="600" y1="488" x2="600" y2="506" stroke="#60758A" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="508" width="1040" height="56" rx="10" fill="#F3F5F7" stroke="#16324F" stroke-width="2"/><text x="112" y="543" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16324F" text-anchor="start">设备层</text><text x="340" y="543" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#263746" text-anchor="start">ESP32-S3 MicroROS V2 + HH-D02 星闪五板</text><rect x="80" y="600" width="1040" height="52" rx="8" fill="#F4F7FA" stroke="#B7C7D5" stroke-width="1"/><text x="100" y="633" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F" text-anchor="start">方向约束</text><text x="250" y="633" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="start">AI 不产生速度流；任何运动指令必须经过 ROS 安全仲裁和失联停车。</text></svg>