<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><title>导航与安全控制</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="690" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 17  路径规划、局部控制与安全门</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">高层目标经过全局/局部控制后仍需进入安全门；安全门拥有最终零速度优先权。</text><rect x="36" y="128" width="200" height="126" rx="14" fill="#E7F5F3" stroke="#138A8A" stroke-width="2"/><text x="136" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#138A8A" text-anchor="middle"><tspan x="136" dy="0">目标点 / 固定路线</tspan><tspan x="136" dy="32">TaskPlan / route</tspan></text><line x1="236" y1="191" x2="310" y2="191" stroke="#138A8A" stroke-width="4" marker-end="url(#arrow)"/><rect x="310" y="128" width="220" height="126" rx="14" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="2"/><text x="420" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2C6DB2" text-anchor="middle"><tspan x="420" dy="0">全局规划</tspan><tspan x="420" dy="32">地图 / 路网 / Nav2</tspan></text><line x1="530" y1="191" x2="604" y2="191" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><rect x="604" y="128" width="220" height="126" rx="14" fill="#FFF3D9" stroke="#D17A16" stroke-width="2"/><text x="714" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#D17A16" text-anchor="middle"><tspan x="714" dy="0">局部控制</tspan><tspan x="714" dy="32">航向误差 / 速度限幅</tspan></text><line x1="824" y1="191" x2="898" y2="191" stroke="#D17A16" stroke-width="4" marker-end="url(#arrow)"/><rect x="898" y="128" width="260" height="126" rx="14" fill="#FBE9E7" stroke="#B54444" stroke-width="2"/><text x="1028" y="182" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#B54444" text-anchor="middle"><tspan x="1028" dy="0">安全门</tspan><tspan x="1028" dy="32">scan / watchdog / E-stop</tspan></text><line x1="1028" y1="254" x2="1028" y2="360" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><rect x="898" y="360" width="260" height="126" rx="14" fill="#E9F6EE" stroke="#2E865A" stroke-width="2"/><text x="1028" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E865A" text-anchor="middle"><tspan x="1028" dy="0">/cmd_vel</tspan><tspan x="1028" dy="32">底盘执行与反馈</tspan></text><line x1="898" y1="423" x2="824" y2="423" stroke="#2E865A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="604" y="360" width="220" height="126" rx="14" fill="#F8FAFC" stroke="#B7C7D5" stroke-width="2"/><text x="714" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F" text-anchor="middle"><tspan x="714" dy="0">/scan + /odom</tspan><tspan x="714" dy="32">障碍距离 / 位姿</tspan></text><line x1="604" y1="423" x2="530" y2="423" stroke="#138A8A" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="360" width="220" height="126" rx="14" fill="#E7F5F3" stroke="#138A8A" stroke-width="2"/><text x="420" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#138A8A" text-anchor="middle"><tspan x="420" dy="0">巡检控制器</tspan><tspan x="420" dy="32">距离误差 / 角度误差</tspan></text><line x1="420" y1="360" x2="420" y2="254" stroke="#138A8A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="