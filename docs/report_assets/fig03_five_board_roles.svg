l, sans-serif" font-size="16" font-weight="700" fill="#D49A22" text-anchor="start">黄色</text><text x="806" y="284" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#16324F" text-anchor="middle">C-SF</text><text x="806" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758A" text-anchor="middle">COM14</text><text x="806" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="806" dy="0">SLE 接收</tspan><tspan x="806" dy="25">中控 UART0</tspan></text><rect x="928" y="205" width="184" height="194" rx="12" fill="#FFFFFF" stroke="#B04AAB" stroke-width="3"/><circle cx="956" cy="236" r="12" fill="#B04AAB" stroke="#B04AAB" stroke-width="1"/><text x="978" y="243" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#B04AAB" text-anchor="start">品红</text><text x="1020" y="284" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#16324F" text-anchor="middle">C-WIFI</text><text x="1020" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758A" text-anchor="middle">COM16</text><text x="1020" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="1020" dy="0">Wi-Fi 接收</tspan><tspan x="1020" dy="25">中控 UART0</tspan></text><line x1="164" y1="430" x2="478" y2="430" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><line x1="478" y1="430" x2="794" y2="430" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><text x="320" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#B54444" text-anchor="middle">UART1 / SLE</text><text x="636" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2C6DB2" text-anchor="middle">UART2 / Wi-Fi</text><line x1="886" y1="399" x2="886" y2="500" stroke="#D17A16" stroke-width="4" marker-end="url(#arrow)"/><line x1="1094" y1="399" x2="1094" y2="500" stroke="##B04AAB" stroke-width="4" marker-end="url(#arrow)"/><rect x="190" y="486" width="820" height="70" rx="10" fill="#F4F7FA" stroke="#B7C7D5" stroke-width="1"/><text x="600" y="528" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="400" fill="#263746" text-anchor="middle">C-SF / C-WIFI 通过 USB-UART 接入 Windows Edge；同一 event_id 才进入正式 A/B 配对。</text></svg>