<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>五板角色</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="650" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 3  五块 HH-D02 星闪板角色与端口映射</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">颜色用于现场识别，端口仅作当前枚举记录；USB 重枚举或 DHCP 变化时以现场回读为准。</text><rect x="40" y="120" width="1120" height="470" rx="18" fill="#FAFCFE" stroke="#B7C7D5" stroke-width="2"/><text x="72" y="158" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324F" text-anchor="start">车辆侧 / R01</text><rect x="72" y="205" width="184" height="194" rx="12" fill="#FFFFFF" stroke="#2E9A68" stroke-width="3"/><circle cx="100" cy="236" r="12" fill="#2E9A68" stroke="#2E9A68" stroke-width="1"/><text x="122" y="243" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2E9A68" text-anchor="start">绿色</text><text x="164" y="284" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700" fill="#16324F" text-anchor="middle">R-SENSE</text><text x="164" y="316" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#60758A" text-anchor="middle">COM12</text><text x="164" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="164" dy="0">传感采样</tspan><tspan x="164" dy="2