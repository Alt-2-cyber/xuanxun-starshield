<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>UART 接线</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="650" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 4  两路事件传输的 UART 接线约束</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">必须完成 TX→RX、GND 共地；实体联调前停止占用中控串口的服务，避免端口冲突。</text><rect x="36" y="120" width="528" height="480" rx="18" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="2"/><rect x="58" y="142" width="170" height="38" rx="19" fill="#2C6DB2" stroke="#2C6DB2" stroke-width="1"/><text x="143" y="168" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">SLE / UART1 路径</text><rect x="80" y="226" width="186" height="112" rx="10" fill="#FFFFFF" stroke="#2E865A" stroke-width="2"/><text x="173" y="263" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="middle"><tspan x="173" dy="0">绿色 R-SENSE</tspan><tspan x="173" dy="27">GPIO15 TX</tspan><tspan x="173" dy="27">COM12</tspan></text><line x1="266" y1="282" x2="390" y2="282" stroke="#B54444" stroke-width="5" marker-end="url(#arrow)"/><text x="328" y="264" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#B54444" text-anchor="middle">TX -&gt; RX</text><rect x="390" y="226" width="124" height="112" rx="10" fill="#FFFFFF" stroke="#B54444" stroke-width="2"/><text x="452" y="263" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#263746" text-anchor="middle"><tspan x="452" dy="0">红色 R-SF</tspan><tspan x="452" dy="27">GPIO16 RX</tspan></text><line x1="173" y1="350" x2="452" y2="350" stroke="#60758A" stroke-width="3"/><text x="312" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">GND 共地；不连接两板 5V</text><line x1="452" y1="400" x2="452" y2="520" stroke="#D17A16" stroke-width="4" marker-end="url(#arrow)"/><text x="470" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#D17A16" text-anchor="start">SLE</text><rect x="62" y="442" width="212" height="76" rx="10" fill="#FFFFFF" stroke="#D17A16" stroke-width="2"/><text x="168" y="487" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="middle">黄色 C-SF / COM14</text><rect x="602" y="120" width="562" height="480" rx="18" fill="#E7F5F3" stroke="#138A8A" stroke-width="2"/><rect x="624" y="142" width="190" height="38" rx="19" fill="#138A8A" stroke="#138A8A" stroke-width="1"/><text x="719" y="168" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wi-Fi / UART2 路径</text><rect x="650" y="226" width="186" height="112" rx="10" fill="#FFFFFF" stroke="#2E865A" stroke-width="2"/><text x="743" y="263" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="middle"><tspan x="743" dy="0">绿色 R-SENSE</tspan><tspan x="743" dy="27">GPIO8 TX</tspan><tspan x="743" dy="27">COM12</tspan></text><line x1="836" y1="282" x2="960" y2="282" stroke="#2C6DB2" stroke-width="5" marker-end="url(#arrow)"/><text x="898" y="264" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2C6DB2" text-anchor="middle">TX -&gt; RX</text><rect x="960" y="226" width="164" height="112" rx="10" fill="#FFFFFF" stroke="#2C6DB2" stroke-width="2"/><text x="1042" y="263" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#263746" text-anchor="middle"><tspan x="1042" dy="0">蓝色 R-WIFI</tspan><tspan x="1042" dy="27">GPIO7 RX</tspan></text><line x1="743" y1="350" x2="1042" y2="350" stroke="#60758A" stroke-width="3"/><text x="892" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">GND 共地；两块板分别 USB 供电</text><line x1="1042" y1="400" x2="1042" y2="520" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><text x="1060" y="468" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2C6DB2" text-anchor="start">UDP</text><rect x="730" y="442" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#138A8A" stroke-width="2"/><text x="855" y="487" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="middle">品红 C-WIFI / COM16</text></svg>