<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>痛点与项目价值</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="650" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 1  地下空间消防巡检痛点与项目价值</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">从“发现慢、进不去、救不了”转化为可移动、可解释、可验证的闭环。</text><rect x="36" y="118" width="350" height="470" rx="18" fill="#FBE9E7" stroke="#B54444" stroke-width="2"/><rect x="60" y="140" width="166" height="38" rx="19" fill="#B54444" stroke="#B54444" stroke-width="1"/><text x="143" y="166" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">地下空间痛点</text><text x="70" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700" fill="#263746" text-anchor="start"><tspan x="70" dy="0">发现慢</tspan><tspan x="70" dy="54">固定烟感存在盲区</tspan><tspan x="70" dy="54">人工巡检频率有限</tspan></text><line x1="70" y1="386" x2="350" y2="386" stroke="#B54444" stroke-width="2"/><text x="70" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start"><tspan x="70" dy="0">进不去</tspan><tspan x="70" dy="33">窄通道、车辆遮挡</tspan><tspan x="70" dy="33">烟气与光照干扰</tspan></text><rect x="426" y="118" width="350" height="470" rx="18" fill="#FFF3D9" stroke="#D17A16" stroke-width="2"/><rect x="450" y="140" width="136" height="38" rx="19" fill="#D17A16" stroke="#D17A16" stroke-width="1"/><text x="518" y="166" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">系统闭环</text><text x="462" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#263746" text-anchor="start"><tspan x="462" dy="0">移动感知</tspan><tspan x="462" dy="54">传感器 + 相机 + 激光雷达</tspan><tspan x="462" dy="54">边缘事件统一编号</tspan></text><line x1="462" y1="386" x2="742" y2="386" stroke="#D17A16" stroke-width="2"/><text x="462" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start"><tspan x="462" dy="0">可解释告警</tspan><tspan x="462" dy="33">先传感器触发，再视觉复核</tspan><tspan x="462" dy="33">证据可回放、状态可追溯</tspan></text><rect x="816" y="118" width="350" height="470" rx="18" fill="#E7F5F3" stroke="#138A8A" stroke-width="2"/><rect x="840" y="140" width="116" height="38" rx="19" fill="#138A8A" stroke="#138A8A" stroke-width="1"/><text x="898" y="166" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">项目价值</text><text x="852" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="700" fill="#263746" text-anchor="start"><tspan x="852" dy="0">发现—定位—确认</tspan><tspan x="852" dy="54">双链路对照实验</tspan><tspan x="852" dy="54">Web / 鸿蒙移动端</tspan></text><line x1="852" y1="386" x2="1132" y2="386" stroke="#138A8A" stroke-width="2"/><text x="852" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start"><tspan x="852" dy="0">安全边界</tspan><tspan x="852" dy="33">AI 只输出任务意图</tspan><tspan x="852" dy="33">ROS 2 负责限速与停车</tspan></text><line x1="386" y1="350" x2="426" y2="350" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><line x1="776" y1="350" x2="816" y2="350" stroke="#D17A16" stroke-width="4" marker-end="url(#arrow)"/></svg>