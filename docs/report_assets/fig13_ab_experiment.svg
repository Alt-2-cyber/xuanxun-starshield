<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><title>A/B 实验</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="690" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 13  严格 SLE/Wi-Fi A/B 实验流程</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">仅纳入同一 event_id 同时出现在 C-SF 与 C-WIFI 的自然事件；演示注入不进入正式统计。</text><rect x="70" y="220" width="210" height="128" rx="14" fill="#E9F6EE" stroke="#2E865A" stroke-width="2"/><text x="175" y="272" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2E865A" text-anchor="middle"><tspan x="175" dy="0">同一 event_id</tspan><tspan x="175" dy="32">t0 / payload</tspan></text><line x1="280" y1="284" x2="410" y2="220" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><line x1="280" y1="284" x2="410" y2="370" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><rect x="410" y="156" width="230" height="128" rx="14" fill="#FBE9E7" stroke="#B54444" stroke-width="2"/><text x="525" y="208" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#B54444" text-anchor="middle"><tspan x="525" dy="0">SLE / C-SF</tspan><tspan x="525" dy="32">t2、ACK、retry</tspan></text><rect x="410" y="348" width="230" height="128" rx="14" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="2"/><text x="525" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C6DB2" text-anchor="middle"><tspan x="525" dy="0">Wi-Fi / C-WIFI</tspan><tspan x="525" dy="32">t2、ACK、retry</tspan></text><line x1="640" y1="220" x2="780" y2="284" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><line x1="640" y1="412" x2="780" y2="284" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><rect x="780" y="220" width="340" height="128" rx="14" fill="#FFF3D9" stroke="#D17A16" stroke-width="2"/><text x="950" y="270" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#D17A16" text-anchor="middle"><tspan x="950" dy="0">配对汇总</tspan><tspan x="950" dy="32">mean / P95 / 胜出数</tspan></text><rect x="120" y="540" width="960" height="70" rx="10" fill="#F4F7FA" stroke="#B7C7D5" stroke-width="1"/><text x="600" y="583" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#B54444" text-anchor="middle">当前真实配对样本 = 0；正式结论必须在完成 R-SENSE→R-SF/R-WIFI 跳线后采集。</text></svg>