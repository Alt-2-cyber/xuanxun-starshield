<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><title>建图定位流水线</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="700" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 15  小车建图、定位与导航的完整技术流水线</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">从传感器时间戳和坐标系开始，经过清洗、状态估计、SLAM、地图固化，最终进入定位与路径规划。</text><rect x="50" y="140" width="330" height="142" rx="14" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="2"/><text x="72" y="174" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#2C6DB2" text-anchor="start">1 传感器准备</text><text x="72" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="start"><tspan x="72" dy="0">/scan /odom /imu</tspan><tspan x="72" dy="30">时间戳、frame_id、QoS</tspan></text><line x1="384" y1="211" x2="422" y2="211" stroke="#2C6DB2" stroke-width="3" marker-end="url(#arrow)"/><rect x="432" y="140" width="330" height="142" rx="14" fill="#E7F5F3" stroke="#138A8A" stroke-width="2"/><text x="454" y="174" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#138A8A" text-anchor="start">2 数据清洗</text><text x="454" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="start"><tspan x="454" dy="0">范围裁剪、无效值过滤</tspan><tspan x="454" dy="30">运动畸变与安装偏差检查</tspan></text><line x1="766" y1="211" x2="804" y2="211" stroke="#138A8A" stroke-width="3" marker-end="url(#arrow)"/><rect x="814" y="140" width="330" height="142" rx="14" fill="#FFF3D9" stroke="#D17A16" stroke-width="2"/><text x="836" y="174" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#D17A16" text-anchor="start">3 状态估计</text><text x="836" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="start"><tspan x="836" dy="0">轮速里程计 + IMU</tspan><tspan x="836" dy="30">odom -&gt; base_footprint</tspan></text><rect x="50" y="360" width="330" height="142" rx="14" fill="#E9F6EE" stroke="#2E865A" stroke-width="2"/><text x="72" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#2E865A" text-anchor="start">4 SLAM 建图</text><text x="72" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="start"><tspan x="72" dy="0">scan + pose</tspan><tspan x="72" dy="30">map -&gt; odom、占据栅格</tspan></text><line x1="384" y1="431" x2="422" y2="431" stroke="#2E865A" stroke-width="3" marker-end="url(#arrow)"/><rect x="432" y="360" width="330" height="142" rx="14" fill="#FBE9E7" stroke="#B54444" stroke-width="2"/><text x="454" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#B54444" text-anchor="start">5 地图固化</text><text x="454" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="start"><tspan x="454" dy="0">map.yaml + image.pgm</tspan><tspan x="454" dy="30">版本、坐标原点、分辨率</tspan></text><line x1="766" y1="431" x2="804" y2="431" stroke="#B54444" stroke-width="3" marker-end="url(#arrow)"/><rect x="814" y="360" width="330" height="142" rx="14" fill="#EEF5F6" stroke="#16324F" stroke-width="2"/><text x="836" y="394" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#16324F" text-anchor="start">6 定位导航</text><text x="836" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="start"><tspan x="836" dy="0">AMCL/SLAM 定位</tspan><tspan x="836" dy="30">目标点 -&gt; 路径 -&gt; /cmd_vel</tspan></text><line x1="380" y1="282" x2="380" y2="352" stroke="#60758A" stroke-width="3" marker-end="url(#arrow)"/><line x1="762" y1="282" x2="762" y2="352" stroke="#60758A" stroke-width="3" marker-end="url(#arrow)"/><rect x="150" y="594" width="900" height="48" rx="8" fill="#F4F7FA" stroke="#B7C7D5" stroke-width="1"/><text x="600" y="625" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="middle">地图质量不是“能显示”即可：必须检查闭环误差、墙体连续性、雷达安装方向、坐标原点和版本号。</text></svg>