<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>事件数据流</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="650" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 7  多源火情事件的数据流与证据闭环</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">先由传感器触发，视觉模块作为复核证据参与；模型失效时进入 VISION_FAULT，不生成虚假视觉 P3。</text><rect x="70" y="230" width="180" height="160" rx="16" fill="#FFF3D9" stroke="#D17A16" stroke-width="2"/><text x="160" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#D17A16" text-anchor="middle"><tspan x="160" dy="0">温度</tspan><tspan x="160" dy="29">烟雾</tspan><tspan x="160" dy="29">气体</tspan></text><line x1="252" y1="310" x2="296" y2="310" stroke="#D17A16" stroke-width="4" marker-end="url(#arrow)"/><rect x="302" y="230" width="180" height="160" rx="16" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="2"/><text x="392" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2C6DB2" text-anchor="middle"><tspan x="392" dy="0">相机帧</tspan><tspan x="392" dy="29">视觉检测</tspan></text><line x1="484" y1="310" x2="528" y2="310" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><rect x="534" y="230" width="180" height="160" rx="16" fill="#FBE9E7" stroke="#B54444" stroke-width="2"/><text x="624" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#B54444" text-anchor="middle"><tspan x="624" dy="0">统一 AlertEvent</tspan></text><line x1="716" y1="310" x2="760" y2="310" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><rect x="766" y="230" width="180" height="160" rx="16" fill="#E7F5F3" stroke="#138A8A" stroke-width="2"/><text x="856" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#138A8A" text-anchor="middle"><tspan x="856" dy="0">双链路</tspan><tspan x="856" dy="29">串口网关</tspan></text><line x1="948" y1="310" x2="992" y2="310" stroke="#138A8A" stroke-width="4" marker-end="url(#arrow)"/><rect x="998" y="230" width="180" height="160" rx="16" fill="#E9F6EE" stroke="#2E865A" stroke-width="2"/><text x="1088" y="285" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E865A" text-anchor="middle"><tspan x="1088" dy="0">Twin + Replay + Web/App</tspan></text><text x="160" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">采样</text><text x="392" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">复核</text><text x="624" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">证据化</text><text x="856" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">传输</text><text x="1088" y="176" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">展示</text><rect x="130" y="474" width="940" height="96" rx="12" fill="#FFFFFF" stroke="#B7C7D5" stroke-width="2"/><text x="600" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="600" dy="0">每条证据携带 event_id、timestamp、pose、sensor_values、transport_samples</tspan><tspan x="600" dy="32">同一事件驱动告警、热区、视频框、链路点和回放时间轴</tspan></text></svg>