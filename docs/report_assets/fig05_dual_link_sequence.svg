<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>双链路时序</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 5  SLE/Wi-Fi 双链路事件时序与正式配对规则</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">严格 A/B 测试记录 t0、t2、ACK、retry，并按同一 event_id 配对，不使用模拟数据替代自然样本。</text><text x="44" y="135" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E865A" text-anchor="start">R-SENSE</text><line x1="146" y1="128" x2="1160" y2="128" stroke="#B7C7D5" stroke-width="2"/><text x="44" y="227" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#B54444" text-anchor="start">R-SF</text><line x1="146" y1="220" x2="1160" y2="220" stroke="#B7C7D5" stroke-width="2"/><text x="44" y="319" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#D17A16" text-anchor="start">C-SF</text><line x1="146" y1="312" x2="1160" y2="312" stroke="#B7C7D5" stroke-width="2"/><text x="44" y="411" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2C6DB2" text-anchor="start">R-WIFI</text><line x1="146" y1="404" x2="1160" y2="404" stroke="#B7C7D5" stroke-width="2"/><text x="44" y="503" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#B04AAB" text-anchor="start">C-WIFI</text><line x1="146" y1="496" x2="1160" y2="496" stroke="#B7C7D5" stroke-width="2"/><text x="44" y="595" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324F" text-anchor="start">Edge</text><line x1="146" y1="588" x2="1160" y2="588" stroke="#B7C7D5" stroke-width="2"/><line x1="230" y1="96" x2="230" y2="622" stroke="#60758A" stroke-width="2" stroke-dasharray="5 5"/><line x1="488" y1="96" x2="488" y2="622" stroke="#60758A" stroke-width="2" stroke-dasharray="5 5"/><line x1="740" y1="96" x2="740" y2="622" stroke="#60758A" stroke-width="2" stroke-dasharray="5 5"/><line x1="1000" y1="96" x2="1000" y2="622" stroke="#60758A" stroke-width="2" stroke-dasharray="5 5"/><text x="230" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">t0 事件生成</text><text x="488" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">车端传输</text><text x="740" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">t2 中控接收</text><text x="1000" y="102" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#60758A" text-anchor="middle">ACK / 入库</text><circle cx="230" cy="128" r="10" fill="#2E865A" stroke="#2E865A" stroke-width="1"/><line x1="240" y1="128" x2="464" y2="220" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><line x1="504" y1="220" x2="718" y2="312" stroke="#D17A16" stroke-width="4" marker-end="url(#arrow)"/><line x1="240" y1="128" x2="464" y2="404" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><line x1="504" y1="404" x2="718" y2="496" stroke="#B04AAB" stroke-width="4" marker-end="url(#arrow)"/><line x1="760" y1="312" x2="972" y2="588" stroke="#D17A16" stroke-width="3" marker-end="url(#arrow)"/><line x1="760" y1="496" x2="972" y2="588" stroke="#2C6DB2" stroke-width="3" marker-end="url(#arrow)"/><text x="370" y="196" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#B54444" text-anchor="middle">SLE 配对</text><text x="370" y="386" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2C6DB2" text-anchor="middle">Wi-Fi 对照</text><text x="850" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#16324F" text-anchor="middle">同一 event_id</text><rect x="210" y="634" width="790" height="48" rx="8" fill="#F4F7FA" stroke="#B7C7D5" stroke-width="1"/><text x="605" y="665" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="middle">正式样本 = SLE 与 Wi-Fi 均到达 Edge，且 event_id 相同；未配对数据只作链路诊断。</text></svg>