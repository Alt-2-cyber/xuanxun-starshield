<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><title>运行模式状态机</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="680" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 9  四种运行模式与安全状态机</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">普通暂停可恢复；急停为锁存状态，不能由 AI 或移动端解除。</text><rect x="100" y="230" width="220" height="100" rx="16" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="3"/><text x="210" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#2C6DB2" text-anchor="middle">固定循迹</text><text x="210" y="306" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758A" text-anchor="middle">route + scan</text><rect x="430" y="230" width="220" height="100" rx="16" fill="#E7F5F3" stroke="#138A8A" stroke-width="3"/><text x="540" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#138A8A" text-anchor="middle">手动控制</text><text x="540" y="306" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758A" text-anchor="middle">Web / App</text><rect x="760" y="230" width="220" height="100" rx="16" fill="#FFF3D9" stroke="#D17A16" stroke-width="3"/><text x="870" y="276" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#D17A16" text-anchor="middle">认知任务智能体</text><text x="870" y="306" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758A" text-anchor="middle">TaskPlan</text><rect x="430" y="470" width="220" height="100" rx="16" fill="#FBE9E7" stroke="#B54444" stroke-width="3"/><text x="540" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#B54444" text-anchor="middle">暂停 / 急停</text><text x="540" y="546" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#60758A" text-anchor="middle">zero velocity</text><line x1="320" y1="280" x2="430" y2="280" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><line x1="650" y1="280" x2="760" y2="280" stroke="#D17A16" stroke-width="4" marker-end="url(#arrow)"/><line x1="870" y1="330" x2="650" y2="470" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><line x1="540" y1="330" x2="540" y2="470" stroke="#B54444" stroke-width="4" marker-end="url(#arrow)"/><line x1="430" y1="520" x2="320" y2="330" stroke="#B54444" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><line x1="650" y1="520" x2="760" y2="330" stroke="#B54444" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="600" y="620" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="400" fill="#263746" text-anchor="middle">所有状态共享：限速 0.25 m/s、角速度 0.80 rad/s、前方 0.45 m 停车、急停锁存</text></svg>