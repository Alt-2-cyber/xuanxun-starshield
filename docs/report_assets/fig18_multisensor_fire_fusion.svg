<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730"><title>多源火情融合</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="730" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 18  多源火情候选、视觉复核与分级输出</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">采用“传感器触发 + 摄像头复核”策略，先保证可解释闭环，再逐步引入专用数据集模型。</text><rect x="80" y="170" width="190" height="100" rx="12" fill="#FFFFFF" stroke="#D17A16" stroke-width="2"/><text x="175" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#D17A16" text-anchor="middle">温度</text><line x1="270" y1="220" x2="760" y2="320" stroke="#D17A16" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="170" width="190" height="100" rx="12" fill="#FFFFFF" stroke="#138A8A" stroke-width="2"/><text x="405" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#138A8A" text-anchor="middle">烟雾/气体</text><line x1="500" y1="220" x2="760" y2="320" stroke="#138A8A" stroke-width="3" marker-end="url(#arrow)"/><rect x="540" y="170" width="190" height="100" rx="12" fill="#FFFFFF" stroke="#2C6DB2" stroke-width="2"/><text x="635" y="228" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C6DB2" text-anchor="middle">视觉 fire/smoke</text><line x1="730" y1="220" x2="760" y2="320" stroke="#2C6DB2" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="260" width="300" height="120" rx="14" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="2"/><text x="910" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#2C6DB2" text-anchor="middle"><tspan x="910" dy="0">候选事件</tspan><tspan x="910" dy="32">event_id + pose + timestamp</tspan></text><line x1="910" y1="380" x2="910" y2="454" stroke="#2C6DB2" stroke-width="4" marker-end="url(#arrow)"/><rect x="690" y="454" width="440" height="120" rx="14" fill="#E9F6EE" stroke="#2E865A" stroke-width="2"/><text x="910" y="504" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#2E865A" text-anchor="middle"><tspan x="910" dy="0">时空与证据融合</tspan><tspan x="910" dy="30">7 帧窗口 / 5 帧命中 / 置信度 &gt;= 0.75</tspan></text><line x1="690" y1="514" x2="540" y2="514" stroke="#2E865A" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="454" width="470" height="120" rx="14" fill="#FFF3D9" stroke="#D17A16" stroke-width="2"/><text x="305" y="504" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#D17A16" text-anchor="middle"><tspan x="305" dy="0">分级输出</tspan><tspan x="305" dy="30">P1 预警 / P2 告警 / P3 视觉确认</tspan></text><rect x="160" y="622" width="880" height="44" rx="8" fill="#F4F7FA" stroke="#B7C7D5" stroke-width="1"/><text x="600" y="651" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#263746" text-anchor="middle">注意：当前版本温度、烟雾、气体仍作为事件证据展示，不参与机器学习评分。</text></svg>