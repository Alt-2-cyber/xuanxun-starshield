<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>总体架构</title><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2C6DB2"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#D17A16"/></marker></defs><rect x="0" y="0" width="1200" height="650" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="36" y="42" font-family="Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F" text-anchor="start">图 2  玄巡·星盾端到端总体架构</text><text x="36" y="78" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="400" fill="#60758A" text-anchor="start">车端负责感知与运动，Ubuntu 负责 ROS 2 与边缘决策，Web/鸿蒙负责安全交互和证据展示。</text><rect x="36" y="114" width="330" height="500" rx="18" fill="#EAF2F8" stroke="#2C6DB2" stroke-width="2"/><rect x="58" y="136" width="126" height="38" rx="19" fill="#2C6DB2" stroke="#2C6DB2" stroke-width="1"/><text x="121" y="162" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">移动车端</text><rect x="64" y="210" width="274" height="92" rx="12" fill="#FFFFFF" stroke="#2C6DB2" stroke-width="2"/><text x="84" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="start"><tspan x="84" dy="0">MicroROS V2 / ESP32-S3</tspan><tspan x="84" dy="28">底盘与 micro-ROS</tspan></text><rect x="64" y="330" width="274" height="92" rx="12" fill="#FFFFFF" stroke="#138A8A" stroke-width="2"/><text x="84" y="364" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="start"><tspan x="84" dy="0">摄像头 + 激光雷达</tspan><tspan x="84" dy="28">/camera /scan /odom</tspan></text><rect x="64" y="450" width="274" height="104" rx="12" fill="#FFFFFF" stroke="#D17A16" stroke-width="2"/><text x="84" y="484" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="start"><tspan x="84" dy="0">HH-D02 星闪板</tspan><tspan x="84" dy="28">R-SENSE 事件生成</tspan></text><line x1="366" y1="365" x2="426" y2="365" stroke="#2C6DB2" stroke-width="5" marker-end="url(#arrow)"/><text x="396" y="340" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700" fill="#2C6DB2" text-anchor="middle">Wi-Fi / micro-ROS</text><rect x="426" y="114" width="366" height="500" rx="18" fill="#F4F7FA" stroke="#B7C7D5" stroke-width="2"/><rect x="448" y="136" width="184" height="38" rx="19" fill="#16324F" stroke="#16324F" stroke-width="1"/><text x="540" y="162" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ubuntu ROS 2 + Edge</text><rect x="452" y="210" width="314" height="86" rx="12" fill="#FFFFFF" stroke="#D17A16" stroke-width="2"/><text x="472" y="244" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="start"><tspan x="472" dy="0">micro-ROS Agent / ROS 2</tspan><tspan x="472" dy="28">话题、TF、控制桥</tspan></text><rect x="452" y="324" width="314" height="86" rx="12" fill="#FFFFFF" stroke="#138A8A" stroke-width="2"/><text x="472" y="358" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="start"><tspan x="472" dy="0">FastAPI + WebSocket</tspan><tspan x="472" dy="28">串口网关 / 安全仲裁</tspan></text><rect x="452" y="438" width="314" height="116" rx="12" fill="#FFFFFF" stroke="#2C6DB2" stroke-width="2"/><text x="472" y="472" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="start"><tspan x="472" dy="0">SQLite + JSONL</tspan><tspan x="472" dy="28">视觉、孪生、回放、实验</tspan></text><line x1="792" y1="365" x2="852" y2="365" stroke="#D17A16" stroke-width="5" marker-end="url(#arrow)"/><rect x="852" y="114" width="314" height="500" rx="18" fill="#E7F5F3" stroke="#138A8A" stroke-width="2"/><rect x="874" y="136" width="142" height="38" rx="19" fill="#138A8A" stroke="#138A8A" stroke-width="1"/><text x="945" y="162" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">交互与展示</text><rect x="878" y="224" width="262" height="96" rx="12" fill="#FFFFFF" stroke="#2C6DB2" stroke-width="2"/><text x="898" y="260" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#263746" text-anchor="start"><tspan x="898" dy="0">Windows Web</tspan><tspan x="898" dy="28">驾驶台 / 数字孪生</tspan></text><rect x="878" y="350" width="262" height="96" rx="12" fill="#FFFFFF" stroke="#2E865A" stroke-width="2"/><text x="898" y="386" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#263746" text-anchor="start"><tspan x="898" dy="0">鸿蒙原生 ArkUI</tspan><tspan x="898" dy="28">告警 / 确认 / 视频 / 暂停</tspan></text><rect x="878" y="476" width="262" height="78" rx="12" fill="#FFFFFF" stroke="#D17A16" stroke-width="2"/><text x="1009" y="510" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#263746" text-anchor="middle">操作员 / 评委</text></svg>